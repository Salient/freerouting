// -----------------------------------------------------------------------------
// Collect publishing information
// -----------------------------------------------------------------------------
// Named `pub`, not `publishing`: an extra property called `publishing` shadows the
// maven-publish extension of the same name, which resolved by luck under Gradle 6
// and is ambiguous on 9.
ext.pub = [:]

apply from: "gradle/project-info.gradle"

ext.pub.pomName = ext.pub.artifactId

// -----------------------------------------------------------------------------
// Performs publishing
// -----------------------------------------------------------------------------

// javadocJar and sourcesJar used to be declared by hand and attached to the
// `archives` configuration; the java extension builds both and wires them into
// assemble and into components.java.
java {
    withJavadocJar()
    withSourcesJar()
}

publishing {
    publications {
        mavenCustom(MavenPublication) {
            groupId = pub.groupId
            artifactId = pub.artifactId
            version = pub.versionId

            // Brings in jar, sourcesJar and javadocJar.
            from components.java
            artifact tasks.named('executableJar')

            pom {
                name = pub.pomName
                description = pub.desc
                url = pub.websiteUrl
                inceptionYear = pub.inceptionYear
                licenses {
                    license {
                        name = pub.license
                        url = pub.licenseUrl
                        distribution = 'repo'
                    }
                }
                scm {
                    url = pub.vcsUrl
                    connection = pub.vcsUrl
                    developerConnection = pub.vcsUrl
                }
                developers {
                    developer {
                        id = pub.developerAlias
                        name = pub.developerName
                    }
                }
            }
        }
    }
}

// Bintray publishing block removed: the com.jfrog.bintray plugin was dropped
// (Bintray and jcenter shut down in 2021, so this could no longer work).
