plugins {
    id 'java'
    id 'maven-publish'
    // net.nemerosa.versioning and com.jfrog.bintray removed: their transitive
    // dependencies were hosted only on jcenter, which shut down in 2021.
    id 'com.github.ben-manes.versions' version '0.52.0'
}

ext.mainClassName = 'eu.mihosoft.freerouting.gui.MainApplication'

// Replaces net.nemerosa.versioning's versioning.info.commit (jcenter-only).
ext.gitCommit = {
    try {
        return 'git rev-parse HEAD'.execute([], project.projectDir).text.trim()
    } catch (Exception e) {
        return 'unknown'
    }
}()

wrapper {
    gradleVersion = '9.5.0'
}

// Build on any modern JDK (developed against 25) while still emitting Java 11
// bytecode. options.release is used instead of source/targetCompatibility because
// it also compiles against the Java 11 API, so a newer JDK cannot silently
// introduce a dependency on a method that does not exist on 11.
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 11
    options.compilerArgs << "-Xlint:unchecked" << "-Xlint:deprecation"
}

// javadoc is way too strict for my taste.
tasks.withType(Javadoc).configureEach {
    options.addStringOption("encoding", "UTF-8")
    options.addStringOption('Xdoclint:none', '-quiet')
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation 'junit:junit:4.10'

    // https://mvnrepository.com/artifact/javax.help/javahelp
    implementation 'javax.help:javahelp:2.0.05'

    implementation 'org.apache.logging.log4j:log4j-api:2.13.0'
    implementation 'org.apache.logging.log4j:log4j-core:2.13.0'

    // Used by the FRPCB importer/exporter (eu.mihosoft.freerouting.designforms.frpcb).
    implementation 'org.json:json:20231013'
}


Date buildTimeAndDate = new Date()
ext {
    buildDate = new java.text.SimpleDateFormat('yyyy-MM-dd').format(buildTimeAndDate)
    buildTime = new java.text.SimpleDateFormat('HH:mm:ss.SSSZ').format(buildTimeAndDate)
}

jar {
    manifest {
        attributes(
          'Automatic-Module-Name': 'eu.mihosoft.freerouting',
          'Built-By': System.properties['user.name'],
          'Created-By': System.properties['java.version'] + " (" + System.properties['java.vendor'] + " " + System.properties['java.vm.version'] + ")",
          'Build-Date': project.buildDate,
          'Build-Time': project.buildTime,
          'Build-Revision': project.gitCommit,
          'Specification-Title': project.name,
          'Specification-Version': project.version,
          'Implementation-Title': project.name,
          'Implementation-Version': project.version
        )
    }
}

// Fat jar: every runtime dependency unpacked alongside our own classes. Gradle 7+
// refuses to write duplicate archive entries, which merging several jars'
// META-INF is guaranteed to produce, hence the explicit duplicatesStrategy.
tasks.register('executableJar', Jar) {
    archiveClassifier = 'executable'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    from files(sourceSets.main.output)
    from({
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    })

    manifest {

        attributes(
                'Automatic-Module-Name': 'eu.mihosoft.freerouting',
                'Built-By': System.properties['user.name'],
                'Created-By': System.properties['java.version'] + " (" + System.properties['java.vendor'] + " " + System.properties['java.vm.version'] + ")",
                'Build-Date': project.buildDate,
                'Build-Time': project.buildTime,
                'Build-Revision': project.gitCommit,
                'Specification-Title': project.name,
                'Specification-Version': project.version,
                'Implementation-Title': project.name,
                'Implementation-Version': project.version,
                'Main-Class': mainClassName
        )
    }
}

// The legacy `artifacts { archives ... }` block used to pull executableJar into
// assemble; maven-publish no longer honours that, so wire it up directly.
tasks.named('assemble') {
    dependsOn 'executableJar'
}

apply from: 'gradle/publishing.gradle'

// write constants to code
def generatedSrcDir = layout.buildDirectory.dir('generated-src')
def constantsVersion = pub.versionId
def constantsBuildDate = buildDate

def writeVersionInfo = tasks.register('writeVersionInfo') {
    outputs.dir(generatedSrcDir)
    doLast {
        def buildInfoCode = generatedSrcDir.get().file('eu/mihosoft/freerouting/constants/Constants.java').asFile
        buildInfoCode.getParentFile().mkdirs()
        buildInfoCode.write("package eu.mihosoft.freerouting.constants;\n"
                + "public class Constants {\n"
                + "  public static final String FREEROUTING_VERSION = \"${constantsVersion}\";\n"
                + "  public static final String FREEROUTING_BUILD_DATE = \"${constantsBuildDate}\";\n"
                + "}\n"
        )
    }
}

// Add the generated constants dir to the folders to compile. Registering the task
// itself (rather than a bare path) is what tells compileJava and sourcesJar alike
// that writeVersionInfo has to run first; Gradle 9 fails the build on an undeclared
// dependency like that instead of quietly racing.
sourceSets.main.java.srcDir writeVersionInfo


